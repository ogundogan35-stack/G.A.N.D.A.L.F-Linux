<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.A.N.D.A.L.F — System HUD</title>
<style>
    :root {
        --bg: #0a0d12;
        --panel: rgba(18, 24, 34, 0.72);
        --line: rgba(234, 179, 8, 0.28);
        --gold: #eab308;
        --gold-dim: #8a6d08;
        --cyan: #38e8d5;
        --text: #e8edf4;
        --dim: #7c8899;
        --user: #855a14;
        --ai: #1a2332;
        --font-ui: "Segoe UI", system-ui, sans-serif;
        --font-hud: "Consolas", "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        background:
            radial-gradient(1200px 600px at 20% -10%, rgba(234,179,8,0.08), transparent 60%),
            radial-gradient(1000px 700px at 110% 110%, rgba(56,232,213,0.06), transparent 55%),
            var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        min-height: 100vh;
        overflow-x: hidden;
    }

    .scanlines::before {
        content: "";
        position: fixed; inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
            0deg, transparent 0 2px, rgba(0,0,0,0.08) 2px 4px);
        z-index: 999;
    }

    .hud {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 20px 40px;
    }

    /* ---------- header ---------- */
    header {
        display: flex; justify-content: space-between; align-items: flex-end;
        margin-bottom: 26px; flex-wrap: wrap; gap: 10px;
    }
    h1 {
        font-family: var(--font-hud);
        font-size: 30px; letter-spacing: 8px;
        background: linear-gradient(90deg, var(--gold), #fff3c4, var(--gold));
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .sub { color: var(--dim); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
    .status-chip {
        display: inline-flex; align-items: center; gap: 8px;
        border: 1px solid var(--line); border-radius: 999px;
        padding: 7px 14px; font-size: 12px; color: var(--cyan);
        background: rgba(56,232,213,0.06);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cyan);
        box-shadow: 0 0 10px var(--cyan); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    #uptime { color: var(--dim); font-family: var(--font-hud); }

    /* ---------- gauges ---------- */
    .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 26px; }
    .gauge {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 20px; padding: 24px;
        display: flex; align-items: center; gap: 22px;
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .ring { position: relative; width: 130px; height: 130px; flex: none; }
    .ring svg { transform: rotate(-90deg); }
    .ring .track { stroke: rgba(124,136,153,0.18); }
    .ring .bar { stroke: var(--gold); stroke-linecap: round;
        transition: stroke-dashoffset 0.9s cubic-bezier(.4,0,.2,1);
        filter: drop-shadow(0 0 6px var(--gold)); }
    .ring .bar.ram { stroke: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
    .ring .val { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; }
    .ring .val b { font-family: var(--font-hud); font-size: 26px; }
    .ring .val span { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
    .gmeta .name { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
    .gmeta .ram-name { color: var(--cyan); }
    .gmeta p { color: var(--dim); font-size: 13px; line-height: 1.5; }

    /* ---------- chat ---------- */
    .feed-head {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 12px;
    }
    .feed-head h2 { font-family: var(--font-hud); font-size: 15px; letter-spacing: 4px;
        color: var(--gold); text-transform: uppercase; }
    .feed-head .live { font-size: 11px; color: var(--cyan); letter-spacing: 1px; }
    .feed {
        background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
        padding: 18px; height: 320px; overflow-y: auto;
        backdrop-filter: blur(6px);
    }
    .feed::-webkit-scrollbar { width: 8px; }
    .feed::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 4px; }
    .msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 10px;
        font-size: 14px; line-height: 1.5; word-break: break-word; }
    .msg .tag { display: block; font-family: var(--font-hud); font-size: 10px;
        letter-spacing: 2px; margin-bottom: 3px; opacity: .75; }
    .msg.user { background: var(--user); color: #fff; border: 1px solid rgba(234,179,8,.25); }
    .msg.user .tag { color: #ffe9a8; }
    .msg.ai { background: var(--ai); color: var(--text); border: 1px solid rgba(56,232,213,.15); }
    .msg.ai .tag { color: var(--cyan); }
    .empty { color: var(--dim); text-align: center; padding-top: 120px; font-style: italic; }

    footer { text-align: center; color: var(--dim); font-size: 12px; margin-top: 26px; letter-spacing: 1px; }

    @media (max-width: 640px) {
        .gauges { grid-template-columns: 1fr; }
        h1 { font-size: 22px; letter-spacing: 5px; }
    }
</style>
</head>
<body class="scanlines">
<div class="hud">
    <header>
        <div>
            <h1>G.A.N.D.A.L.F</h1>
            <div class="sub">System Intelligence Terminal</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
            <span class="status-chip"><span class="dot"></span>&nbsp;ONLINE</span>
            <span id="uptime">UPTIME 0s</span>
        </div>
    </header>

    <section class="gauges">
        <div class="gauge">
            <div class="ring" id="cpuRing">
                <svg width="130" height="130" viewBox="0 0 130 130">
                    <circle class="track" cx="65" cy="65" r="56" fill="none" stroke-width="12"/>
                    <circle class="bar" id="cpuBar" cx="65" cy="65" r="56" fill="none"
                        stroke-width="12" stroke-dasharray="351.86" stroke-dashoffset="351.86"/>
                </svg>
                <div class="val"><b id="cpuVal">0%</b><span>CPU</span></div>
            </div>
            <div class="gmeta">
                <div class="name">Processor</div>
                <p>Live central processor load across all cores.</p>
            </div>
        </div>

        <div class="gauge">
            <div class="ring" id="ramRing">
                <svg width="130" height="130" viewBox="0 0 130 130">
                    <circle class="track" cx="65" cy="65" r="56" fill="none" stroke-width="12"/>
                    <circle class="bar ram" id="ramBar" cx="65" cy="65" r="56" fill="none"
                        stroke-width="12" stroke-dasharray="351.86" stroke-dashoffset="351.86"/>
                </svg>
                <div class="val"><b id="ramVal">0%</b><span>RAM</span></div>
            </div>
            <div class="gmeta">
                <div class="name ram-name">Memory</div>
                <p>Physical memory consumption of the host system.</p>
            </div>
        </div>
    </section>

    <div class="feed-head">
        <h2>Live Conversation</h2>
        <span class="live">● STREAMING</span>
    </div>
    <div class="feed" id="feed"></div>

    <footer>GANDALF SYSTEM HUD · LOCAL NETWORK MONITOR</footer>
</div>

<script>
    const CIRC = 351.86;
    const feed = document.getElementById('feed');
    let lastTs = 0;
    let rendered = 0;

    function setGauge(barId, valId, val) {
        const bar = document.getElementById(barId);
        const txt = document.getElementById(valId);
        const pct = Math.max(0, Math.min(100, val));
        bar.style.strokeDashoffset = (CIRC - (CIRC * pct / 100)).toFixed(2);
        txt.textContent = Math.round(pct) + '%';
    }

    function renderHistory(history) {
        feed.innerHTML = '';
        if (!history || !history.length) {
            feed.innerHTML = '<div class="empty">Awaiting first transmission…</div>';
            return;
        }
        history.forEach(line => {
            const low = line.toLowerCase();
            const isUser = low.startsWith('you:') || low.startsWith('sen:');
            const cls = isUser ? 'user' : 'ai';
            const tag = isUser ? 'OPERATOR' : 'GANDALF';
            const el = document.createElement('div');
            el.className = 'msg ' + cls;
            el.innerHTML = '<span class="tag">' + tag + '</span>' + escapeHtml(line);
            feed.appendChild(el);
        });
        feed.scrollTop = feed.scrollHeight;
        rendered = history.length;
    }

    function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function tick() {
        try {
            const r = await fetch('/api/stats');
            const d = await r.json();
            setGauge('cpuBar', 'cpuVal', d.cpu);
            setGauge('ramBar', 'ramVal', d.ram);
            document.getElementById('uptime').textContent =
                'UPTIME ' + Math.floor(d.uptime/60) + 'm ' + (d.uptime%60) + 's';
            if (d.history && (d.history.length !== rendered || d.ts !== lastTs)) {
                renderHistory(d.history);
                lastTs = d.ts;
            }
        } catch (e) {
            console.warn('stats fetch failed', e);
        }
    }

    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
